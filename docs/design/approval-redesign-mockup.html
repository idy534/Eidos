<!doctype html>
<html lang="zh-CN" data-theme="light" data-platform="macos" data-view="new" data-width="standard" data-reduced-motion="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eidos · 审批体验重构原型</title>
<style>
  /* ==========================================================================
     1. Eidos Design Tokens (Aligned with desktop/renderer/src/styles/tokens.css)
     ========================================================================== */
  :root {
    color-scheme: light;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --font-code: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Cascadia Mono", "PingFang SC", "Microsoft YaHei UI", monospace;

    --font-size-xs: 11px;
    --font-size-caption: 12px;
    --font-size-sidebar: 13px;
    --font-size-code: 12.5px;
    --font-size-body: 14px;
    --font-size-title: 16px;
    --line-height-code: 19px;
    --line-height-body: 22px;

    /* Surface & Text (Light) */
    --page-bg: #e9ecf1;
    --surface: #f8f9fb;
    --surface-raised: #ffffff;
    --surface-muted: #f0f2f5;
    --surface-footer: #f4f5f7;
    --surface-hover: #f3f3f6;
    --surface-selected: #e5e8ec;
    --surface-header: rgba(248, 249, 251, 0.9);
    --surface-overlay: rgba(255, 255, 255, 0.88);
    --code-inline-bg: #eef0f2;

    --text: #1d1d1f;
    --text-secondary: #48484a;
    --muted: #5a5e66;
    --text-tertiary: #6e737b;
    --text-on-accent: #ffffff;

    --line: rgba(0, 0, 0, 0.07);
    --border-strong: rgba(0, 0, 0, 0.13);
    --hover-tint: rgba(0, 0, 0, 0.045);
    --active-tint: rgba(0, 0, 0, 0.085);

    /* Primary & Danger */
    --accent: #2e624c;
    --accent-soft: #e5ede8;
    --accent-glow: rgba(46, 98, 76, 0.22);
    --action-primary-hover: #274e3c;
    --action-primary-active: #1e3d2f;
    --primary-action-bg: var(--accent-soft);
    --primary-action-bg-hover: #dbe5df;
    --primary-action-bg-active: #d1ded6;
    --primary-action-text: #204535;
    --primary-action-icon: #385d4c;
    --primary-action-border: rgba(46, 98, 76, 0.15);

    --danger: #913d34;
    --danger-soft: #fbf0ee;
    --action-danger-hover: #7a3028;
    --action-danger-active: #65251e;

    /* Semantic Status */
    --status-success: #246845;
    --status-success-bg: #eaf5ee;
    --status-warning: #8a6723;
    --status-warning-bg: #fcf6e8;
    --status-danger: #9e352b;
    --status-danger-bg: #fceceb;
    --status-info: #235882;
    --status-info-bg: #e9f2f9;
    --status-neutral: #50555c;
    --status-neutral-bg: #f0f0f3;

    /* Tool Group & Feed */
    --tg-text: #6b706c;
    --tg-text-strong: #3d423e;
    --tg-rail: rgba(0, 0, 0, 0.09);
    --diff-add-bg: rgba(36, 104, 69, 0.09);
    --diff-add-text: #1f5a3b;
    --diff-del-bg: rgba(158, 53, 43, 0.08);
    --diff-del-text: #8a3027;

    /* Radii & Shadows */
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-menu: 9px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 16px;
    --radius-pill: 9999px;

    --apple-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
    --apple-shadow-md: 0 6px 20px -3px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.03);
    --apple-shadow-lg: 0 14px 36px -6px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.05);
    --shadow-popover: 0 0.7rem 2rem rgb(25 30 26 / 16%);

    /* Motion */
    --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --focus-ring: 2px solid rgba(46, 98, 76, 0.45);
    --scrollbar-thumb: rgba(106, 111, 103, 0.28);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #0c0e11;
    --surface: #141619;
    --surface-raised: #1c1f24;
    --surface-muted: #22262c;
    --surface-footer: #181b20;
    --surface-hover: #252930;
    --surface-selected: #2d323b;
    --surface-header: rgba(20, 22, 25, 0.9);
    --surface-overlay: rgba(28, 31, 36, 0.92);
    --code-inline-bg: #262b33;

    --text: #eceef1;
    --text-secondary: #c4c8ce;
    --muted: #9aa0a6;
    --text-tertiary: #8c929a;

    --line: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.16);
    --hover-tint: rgba(255, 255, 255, 0.06);
    --active-tint: rgba(255, 255, 255, 0.11);

    --accent: #3d8b6b;
    --accent-soft: rgba(61, 139, 107, 0.20);
    --accent-glow: rgba(61, 139, 107, 0.28);
    --action-primary-hover: #357a5e;
    --action-primary-active: #2c674f;
    --primary-action-bg: var(--accent-soft);
    --primary-action-bg-hover: rgba(61, 139, 107, 0.28);
    --primary-action-bg-active: rgba(61, 139, 107, 0.36);
    --primary-action-text: #a7e3c8;
    --primary-action-icon: #8ed8b7;
    --primary-action-border: rgba(142, 216, 183, 0.22);

    --danger: #e06c60;
    --danger-soft: rgba(224, 108, 96, 0.14);
    --action-danger-hover: #c5554a;
    --action-danger-active: #a8443a;

    --status-success: #5cc98f;
    --status-success-bg: rgba(92, 201, 143, 0.14);
    --status-warning: #e0b458;
    --status-warning-bg: rgba(224, 180, 88, 0.14);
    --status-danger: #f07b6e;
    --status-danger-bg: rgba(240, 123, 110, 0.14);
    --status-info: #7ab0ff;
    --status-info-bg: rgba(122, 176, 255, 0.14);
    --status-neutral: #aeb4bc;
    --status-neutral-bg: #252930;

    --tg-text: #9aa0a6;
    --tg-text-strong: #d4d8de;
    --tg-rail: rgba(255, 255, 255, 0.12);
    --diff-add-bg: rgba(92, 201, 143, 0.14);
    --diff-add-text: #85ddb0;
    --diff-del-bg: rgba(240, 123, 110, 0.14);
    --diff-del-text: #f39a90;

    --apple-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
    --apple-shadow-md: 0 10px 28px -4px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.25);
    --apple-shadow-lg: 0 18px 42px -8px rgba(0, 0, 0, 0.56);
    --shadow-popover: 0 0.75rem 2.2rem rgb(0 0 0 / 55%);
    --focus-ring: 2px solid rgba(236, 238, 241, 0.52);
  }

  :root[data-platform="windows"] {
    --surface-header: var(--surface);
    --surface-overlay: var(--surface-raised);
  }

  /* ==========================================================================
     2. Page Shell & Top Control Bar
     ========================================================================== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
    -webkit-font-smoothing: antialiased;
    transition: background-color 180ms ease, color 180ms ease;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 10px 24px;
    background: var(--surface-overlay);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }
  :root[data-platform="windows"] .topbar {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .topbar-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .topbar-mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--primary-action-border);
  }
  .topbar-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .seg {
    display: inline-flex;
    align-items: center;
    padding: 2px;
    gap: 2px;
    background: var(--surface-muted);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
  }
  .seg button {
    font: inherit;
    font-size: var(--font-size-caption);
    font-weight: 500;
    border: 0;
    border-radius: var(--radius-sm);
    padding: 3px 9px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease, transform 110ms var(--ease-out);
  }
  .seg button:hover { color: var(--text); }
  .seg button:active { transform: scale(0.97); }
  .seg button[aria-pressed="true"] {
    background: var(--surface-raised);
    color: var(--text);
    box-shadow: var(--apple-shadow-sm);
  }
  .seg button[data-view-btn="new"][aria-pressed="true"] {
    color: var(--primary-action-text);
    background: var(--accent-soft);
  }
  .seg button:focus-visible,
  .ctrl-toggle:focus-visible {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }
  .ctrl-toggle {
    font: inherit;
    font-size: var(--font-size-caption);
    font-weight: 500;
    padding: 4px 10px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: var(--surface-raised);
    color: var(--muted);
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease, transform 110ms var(--ease-out);
  }
  .ctrl-toggle:hover { color: var(--text); background: var(--surface-hover); }
  .ctrl-toggle:active { transform: scale(0.97); }
  .ctrl-toggle[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--primary-action-text);
    border-color: var(--primary-action-border);
  }

  /* Two-column Workspace Layout */
  .layout {
    max-width: 1220px;
    margin: 0 auto;
    padding: 24px 24px 56px;
    display: grid;
    grid-template-columns: minmax(0, 50rem) minmax(300px, 21rem);
    gap: 24px;
    align-items: start;
    justify-content: center;
  }
  @media (max-width: 1060px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
  }

  /* ==========================================================================
     3. Simulated Eidos Session Window
     ========================================================================== */
  .window-stage {
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .window {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-strong);
    box-shadow: var(--apple-shadow-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: width 220ms var(--apple-spring);
  }
  :root[data-width="narrow"] .window {
    width: 460px;
    max-width: 100%;
  }

  .window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 44px;
    padding: 0 16px;
    background: var(--surface-header);
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .window-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .traffic-lights {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
  }
  .traffic-lights span {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: block;
    border: 0.5px solid rgba(0, 0, 0, 0.12);
  }
  .tl-red { background: #ff5f57; }
  .tl-yellow { background: #febc2e; }
  .tl-green { background: #28c840; }
  :root[data-platform="windows"] .traffic-lights { display: none; }

  .window-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .window-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .mode-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: var(--font-size-xs);
    font-weight: 550;
    background: var(--surface-muted);
    color: var(--text-secondary);
    border: 1px solid var(--line);
  }
  .mode-pill--auto {
    background: var(--accent-soft);
    color: var(--primary-action-text);
    border-color: var(--primary-action-border);
  }
  .mode-pill--danger {
    background: var(--status-danger-bg);
    color: var(--status-danger);
    border-color: color-mix(in srgb, var(--danger) 28%, transparent);
  }

  /* Recovery Banner Slot */
  .recovery-slot { flex: none; }

  /* Feed Area */
  .feed {
    padding: 20px 28px 18px;
    min-height: 360px;
    max-height: 600px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }
  :root[data-width="narrow"] .feed { padding: 16px 14px 14px; }

  .user-bubble {
    margin: 0 0 18px auto;
    width: fit-content;
    max-width: 82%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
    background: var(--surface-muted);
    color: var(--text);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
  }

  /* Process Group */
  .process-group { margin: 0 0 14px; }
  .process-group > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 0 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: var(--font-size-body);
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .process-group > summary::-webkit-details-marker { display: none; }
  .process-group > summary::after {
    content: "";
    width: 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 150ms var(--ease-out);
  }
  .process-group[open] > summary::after {
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .process-text {
    margin: 0 0 12px;
    color: var(--text);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
  }
  .process-text code,
  .prose code {
    font-family: var(--font-code);
    font-size: 12.5px;
    background: var(--code-inline-bg);
    padding: 1px 5px;
    border-radius: var(--radius-xs);
    color: var(--text);
  }

  /* Tool Items & Shell Items (Matches ExecutionFeed.css) */
  .tool-item {
    margin: 0 0 10px;
    color: var(--tg-text);
  }
  .tool-item > summary {
    display: grid;
    grid-template-columns: 1.15rem minmax(0, max-content) auto auto;
    gap: 6px;
    align-items: center;
    width: fit-content;
    max-width: 100%;
    padding: 2px 6px 2px 2px;
    margin-left: -2px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
    list-style: none;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .tool-item > summary::-webkit-details-marker { display: none; }
  .tool-item > summary:hover {
    background: var(--hover-tint);
    color: var(--tg-text-strong);
  }
  .tool-summary-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tool-chevron {
    width: 6px;
    height: 6px;
    border-right: 1.5px solid var(--text-tertiary);
    border-bottom: 1.5px solid var(--text-tertiary);
    transform: rotate(-45deg);
    transition: transform 160ms var(--apple-spring);
    margin-left: 2px;
  }
  .tool-item[open] .tool-chevron {
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .tool-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.15rem;
    height: 1.15rem;
    color: var(--tg-text);
    flex: none;
  }
  .tool-icon svg { width: 14px; height: 14px; display: block; }

  .tool-item--quiet-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 10px;
    color: var(--tg-text);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
  }
  .tool-item--quiet-row .tool-icon { color: var(--accent); }

  /* Shell Card Body */
  .shell-result {
    position: relative;
    margin: 6px 0 8px 1.4rem;
    padding: 0 0 26px;
  }
  .shell-command-zone {
    position: relative;
    margin: 0 0 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-muted);
    overflow: hidden;
  }
  .shell-command {
    margin: 0;
    padding: 8px 36px 8px 11px;
    font: var(--font-size-code)/var(--line-height-code) var(--font-code);
    color: var(--text-secondary);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .shell-command-prompt { color: var(--text-tertiary); user-select: none; }
  .shell-output {
    margin: 0 0 6px;
    padding: 0 4px;
    font: var(--font-size-code)/var(--line-height-code) var(--font-code);
    color: var(--text-secondary);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .shell-status {
    position: absolute;
    right: 4px;
    bottom: 2px;
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--font-size-caption);
    color: var(--tg-text);
  }
  .shell-status-audit {
    color: var(--text-tertiary);
    font-size: 11.5px;
  }
  .shell-status--success { color: var(--status-success); }

  .copy-mini {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 120ms ease, background-color 120ms ease, color 120ms ease;
  }
  .shell-command-zone:hover .copy-mini,
  .approval-code-wrap:hover .copy-mini,
  .copy-mini.is-copied {
    opacity: 1;
  }
  .copy-mini:hover { background: var(--hover-tint); color: var(--text); }
  .copy-mini.is-copied { color: var(--status-success); }

  /* ==========================================================================
     4. OLD ("现状") Styles - Faithfully reproducing current pain points
     ========================================================================== */
  .old-feed-label {
    margin: 0 0 4px !important;
    color: var(--accent);
    font-size: var(--font-size-caption);
    font-weight: 750;
    line-height: 19px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .old-run-notice-warning {
    margin: 4px 0 6px;
    color: #8a6723;
    font-size: var(--font-size-caption);
  }
  .old-recovery-naked {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--text);
    border-bottom: 1px dashed var(--line);
  }
  .old-recovery-naked button {
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text);
    cursor: pointer;
  }

  /* Old ApprovalStatusBanner (replaces Composer) */
  .old-status-banner {
    width: min(calc(100% - 2.5rem), 48rem);
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 15px;
    border-radius: 12px;
    border: 1px solid rgba(49, 95, 74, 0.16);
    background: linear-gradient(135deg, rgba(223, 233, 226, 0.45) 0%, var(--surface) 100%);
    box-shadow: 0 2px 10px rgba(25, 30, 26, 0.05);
  }
  .old-status-banner-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .old-status-banner-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); flex: none;
  }
  .old-spinner { animation: spin 0.9s linear infinite; }
  .old-status-banner-title { font-size: 12.5px; font-weight: 500; color: var(--text); display: block; }
  .old-status-banner-hint { font-size: 11px; color: var(--text-tertiary); display: block; }
  .old-status-banner-badge {
    padding: 2px 8px; border-radius: var(--radius-pill);
    font-size: 10.5px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); flex: none;
  }

  /* Old ApprovalComposer Card */
  .old-approval-card {
    width: min(calc(100% - 2.5rem), 48rem);
    margin: 0 auto 16px;
    border: 1px solid rgba(49, 95, 74, 0.16);

  /* ==========================================================================
     5. NEW DESIGN: LiveActivityLine + Auto-Review Progress + Popover
     ========================================================================== */
  .live-activity {
    position: relative;

  .live-activity-row {

  .live-activity-text {

  .btn {

  const state = {
    view: "new",
    theme: "light",
    platform: "macos",
    width: "standard",
    reducedMotion: false,
    scenario: "auto_progress",
    // Scenario 1 interactive auto-review demo
    autoStep: 2, // 1..3
    autoOutcome: "running", // running | approved | rejected | escalated
    popoverOpen: false,
    autoTimer: null,
    // Scenario 4 interactive state
    normalVariant: "shell", // shell | diff
    normalDecision: null, // null | approved | rejected
    normalFeedbackOpen: false,
    normalFeedbackText: "",
    // Scenario 5 interactive state
    dangerDecision: null,
    dangerFeedbackOpen: false,
    dangerFeedbackText: "",
    // Scenario 7 interactive state
    recoveryStatus: "error", // error | loading | recovered
    showExpiredCard: false,
    // Draft text preserved in composer
    composerDraft: "",
  };

  function esc(str) {
    return String(str).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  }

  function clearAutoTimer() {
    if (state.autoTimer) {
      clearInterval(state.autoTimer);
      clearTimeout(state.autoTimer);
      state.autoTimer = null;
    }
  }

  function renderComposer(placeholder = "继续输入指令，或在任务执行中排队引导…") {
    const modeLabel = state.scenario === "manual_normal" || state.scenario === "manual_outcome" || state.scenario === "banners_edge"
      ? "请求审批"
      : "替我审批";
    return `
      <div class="composer">
        <textarea id="session-composer-input" placeholder="${esc(placeholder)}">${esc(state.composerDraft)}</textarea>
        <div class="composer-bar">
          <div class="composer-bar-left">
            <span class="composer-chip">工作区 · eidos-desktop</span>
            <span class="composer-chip ${modeLabel === "替我审批" ? "composer-chip--accent" : ""}">${modeLabel} ▾</span>
            <span class="composer-chip">Gemini 4 Neon</span>
          </div>
          <button type="button" class="composer-send" aria-label="发送消息">${ICONS.arrowUp}</button>
        </div>
      </div>
    `;
  }

  function renderApprovalSheet({
    idPrefix,
    title,
    danger = false,
    expired = false,
    chips = [],
    warningText = "",
    payloadKind = "command",
    command = "",
    kvRows = [],
    moreText = "",
    feedbackOpen = false,
    feedbackText = "",
  }) {
    const icon = danger || expired ? ICONS.alertTriangle : ICONS.shield;
    const chipHtml = chips.map((c) => `<span class="scope-chip ${c.cls || ""}">${esc(c.text)}</span>`).join("");
    const diffHtml = `
      <div class="diff-card">
        <div class="diff-card-file"><span>~/.config/eidos-probe/endpoints.json</span><span>+2  -1</span></div>
        <div class="diff-lines">
          <div class="diff-line diff-line--ctx">  "timeoutMs": 5000,</div>
          <div class="diff-line diff-line--del">- "proxy": "http://127.0.0.1:10808",</div>
          <div class="diff-line diff-line--add">+ "proxy": null,</div>
          <div class="diff-line diff-line--add">+ "directFallback": true</div>
        </div>
      </div>
    `;
    const cmdHtml = `
      <div class="approval-code-wrap">
        <pre class="approval-code">$ ${esc(command)}</pre>
        <button type="button" class="copy-mini" data-copy-text="${esc(command)}" title="复制命令" aria-label="复制命令">${ICONS.copy}</button>
      </div>
    `;
    const rowsHtml = kvRows.map(([k, v, mono]) => `
      <div class="kv-row"><dt>${esc(k)}</dt><dd class="${mono ? "kv-mono" : ""}">${esc(v)}</dd></div>
    `).join("");

    return `
      <article class="approval-sheet ${danger ? "approval-sheet--danger" : ""} ${expired ? "approval-sheet--expired" : ""}" aria-label="${esc(title)}">
        <header class="approval-sheet-head">
          <div class="approval-sheet-title-wrap">
            <span class="approval-sheet-icon" aria-hidden="true">${icon}</span>
            <h3 class="approval-sheet-title">${esc(title)}</h3>
          </div>
          <div class="approval-sheet-tags">${chipHtml}</div>
        </header>
        <div class="approval-sheet-body">
          ${warningText ? `<div class="approval-danger-note" role="alert">${ICONS.alertTriangle}<span>${esc(warningText)}</span></div>` : ""}
          ${payloadKind === "diff" ? diffHtml : cmdHtml}
          <dl class="kv-table">${rowsHtml}</dl>
          ${moreText ? `
            <details class="more-params">
              <summary>更多参数</summary>
              <div class="more-params-body">${esc(moreText)}</div>
            </details>
          ` : ""}
        </div>
        <div class="reject-drawer" ${feedbackOpen && !expired ? "" : "hidden"}>
          <input type="text" class="reject-input" id="${idPrefix}-feedback-input" placeholder="补充拒绝原因或替代要求，按 Enter 提交…" value="${esc(feedbackText)}" />
        </div>
        <footer class="approval-sheet-foot">
          <button type="button" class="btn btn--ghost btn--sm ${feedbackOpen ? "is-active" : ""}" data-sheet-action="toggle-feedback" data-sheet="${idPrefix}" ${expired ? "disabled" : ""}>
            ${feedbackOpen ? "收起原因" : "+ 拒绝原因"}
          </button>
          <div class="foot-actions">
            <button type="button" class="btn btn--secondary" data-sheet-action="reject" data-sheet="${idPrefix}" ${expired ? "disabled" : ""}>
              拒绝 ${expired ? "" : '<span class="kbd">⌘⌫</span>'}
            </button>
            <button type="button" class="btn ${danger ? "btn--danger" : "btn--primary"}" data-sheet-action="approve" data-sheet="${idPrefix}" ${expired ? "disabled" : ""}>
              ${danger ? "允许并执行" : '批准 <span class="kbd">⌘↩</span>'}
            </button>
          </div>
        </footer>
      </article>
    `;
  }

  function renderOldApprovalCard({ danger = false, expired = false, warningText = "", command = "", title = "批准命令所需权限" }) {
    return `
      <article class="old-approval-card ${danger ? "old-approval-card--danger" : ""}" style="${expired ? "opacity:0.72;filter:grayscale(0.25);" : ""}">
        <div class="old-approval-heading">
          <div class="old-approval-heading-left">
            <div class="old-approval-heading-icon">${danger ? ICONS.alertTriangle : ICONS.shield}</div>
            <div class="old-approval-heading-text">
              <h3>${esc(title)}</h3>
              <span style="opacity:.45;font-size:12px;">·</span>
              <span class="old-approval-heading-tag"><span class="old-pulse"></span><span>${expired ? "审批已失效" : "需要你的批准"}</span></span>
            </div>
          </div>
          <span class="old-approval-badge">${expired ? "已过期" : "Shell 命令"}</span>
        </div>
        <div class="old-approval-body">
          ${warningText ? `<div class="old-approval-warning">${ICONS.alertTriangle}<span>${esc(warningText)}</span></div>` : ""}
          <pre style="margin:0 0 12px;padding:10px 12px;border-radius:8px;border:1px solid rgba(49,95,74,.15);background:var(--surface-muted);font:12.5px/19px var(--font-code);white-space:pre-wrap;color:var(--text);">${esc(command)}</pre>
          <dl class="old-approval-details">
            <div><dt>模型说明</dt><dd>在联网审批下重跑探测，确认授权后能否出网</dd></div>
            <div><dt>目录</dt><dd>当前工作区</dd></div>
            <div><dt>执行方式</dt><dd>${danger ? "沙盒外执行" : "沙盒内执行（已扩展权限）"}</dd></div>
            <div><dt>批准范围</dt><dd>仅本次命令</dd></div>
          </dl>
        </div>
        <div class="old-approval-footer">
          <span class="old-approval-hint">${ICONS.shield}<span>核对命令及授权范围后再行决定</span></span>
          <details class="old-feedback-raw">
            <summary>附带拒绝原因</summary>
            <input type="text" placeholder="输入拒绝原因…" ${expired ? "disabled" : ""} />
          </details>
          <div class="foot-actions">
            <button type="button" class="btn btn--secondary" ${expired ? "disabled" : ""}>拒绝</button>
            <button type="button" class="btn ${danger ? "btn--danger" : "btn--primary"}" ${expired ? "disabled" : ""}>${danger ? "允许并执行" : "批准"}</button>
          </div>
        </div>
      </article>
    `;
  }

  function renderShellDetails({ summaryText, cmd, out, badgeHtml = "", auditNote = "", open = false }) {
    return `
      <details class="tool-item" ${open ? "open" : ""}>
        <summary>
          <span class="tool-icon" aria-hidden="true">${ICONS.shell}</span>
          <span class="tool-summary-text">${esc(summaryText)}</span>
          ${badgeHtml}
          <span class="tool-chevron" aria-hidden="true"></span>
        </summary>
        <div class="shell-result">
          <div class="shell-command-zone">
            <pre class="shell-command"><span class="shell-command-prompt">$ </span>${esc(cmd)}</pre>
            <button type="button" class="copy-mini" data-copy-text="${esc(cmd)}" title="复制命令" aria-label="复制命令">${ICONS.copy}</button>
          </div>
          ${out ? `<pre class="shell-output">${esc(out)}</pre>` : ""}
          <p class="shell-status shell-status--success">
            ${auditNote ? `<span class="shell-status-audit">${esc(auditNote)}</span>` : ""}
            <span>✓ 成功</span>
          </p>
        </div>
      </details>
    `;
  }

  /* ==========================================================================
     Scenario Renderers
     ========================================================================== */
  function buildScenarioView() {
    const isNew = state.view === "new";
    let recoveryHtml = "";
    let feedHtml = "";
    let composerHtml = "";

    // 1. Auto Review In Progress
    if (state.scenario === "auto_progress") {
      const steps = [
        { title: "整理命令与权限证据", statusText: "正在自动审批 · 整理命令与权限证据", time: "0.2s" },
        { title: "评估联网访问风险", statusText: "正在自动审批 · 评估联网访问风险", time: "0.6s" },
        { title: "生成判定结果", statusText: "正在自动审批 · 生成判定结果", time: "0.4s" },
      ];
      const activeIdx = Math.min(2, Math.max(0, state.autoStep - 1));

      if (!isNew) {
        feedHtml = `
          <div class="user-bubble">验证一下当前环境能否访问外网，必要时申请联网并排查失败原因</div>
          <details class="process-group" open>
            <summary>正在处理 18s</summary>
            <p class="process-text">我来发起一次命令级的联网审批，批准后立即用同一套探测做对照。</p>
            ${renderShellDetails({
              summaryText: "等待批准 · 在联网审批下重跑探测，确认授权后能否出网",
              cmd: "curl -sS -I --max-time 6 https://api.github.com",
              out: ""
            })}
          </details>
          <p class="old-run-notice-warning">等待批准</p>
        `;
        composerHtml = `
          <div class="old-status-banner" role="status">
            <div class="old-status-banner-main">
              <div class="old-status-banner-icon">${ICONS.spinner}</div>
              <div>
                <span class="old-status-banner-title">模型正在审查操作…</span>
                <span class="old-status-banner-hint">正在评估工具调用的安全性与潜在风险</span>
              </div>
            </div>
            <span class="old-status-banner-badge">替我审批</span>
          </div>
        `;
        return { recoveryHtml, feedHtml, composerHtml };
      }

      // New design for Scenario 1
      let liveOrOutcome = "";
      let extraTools = "";
      if (state.autoOutcome === "running") {
        const currentStep = steps[activeIdx];
        const stepsListHtml = steps.map((st, idx) => {
          const stState = idx < activeIdx ? "done" : idx === activeIdx ? "active" : "todo";
          const dot = stState === "done" ? "✓" : stState === "active" ? "●" : "○";
          const tm = stState === "done" ? st.time : stState === "active" ? "进行中" : "";
          return `<li data-state="${stState}"><span class="pop-step-dot">${dot}</span><span>${esc(st.title)}</span><span class="pop-step-time">${esc(tm)}</span></li>`;
        }).join("");

        liveOrOutcome = `
          <div class="live-activity" role="status">
            <div class="live-activity-popover" id="auto-review-popover" role="dialog" aria-label="自动审批进度" ${state.popoverOpen ? "" : "hidden"}>
              <div class="pop-header">
                <p class="pop-caption">自动审批 · 实时进度</p>
                <span class="pop-mode-badge">替我审批</span>
              </div>
              <p class="pop-op-title">命令联网探测（低风险）</p>
              <div class="pop-cmd">$ curl -sS -I --max-time 6 https://api.github.com</div>
              <ul class="pop-steps">${stepsListHtml}</ul>
            </div>
            <button type="button" class="live-activity-row" id="auto-review-trigger" aria-expanded="${state.popoverOpen}" aria-controls="auto-review-popover">
              <span class="live-activity-lead" aria-hidden="true">${ICONS.shieldTrace}</span>
              <span class="live-activity-text is-swapping">${esc(currentStep.statusText)}</span>
              <span class="live-step-count">${state.autoStep}/3</span>
              <span class="live-activity-more" aria-hidden="true"></span>
            </button>
          </div>
        `;
        composerHtml = renderComposer();
      } else if (state.autoOutcome === "approved") {
        extraTools = renderShellDetails({
          summaryText: "已完成 · 在联网审批下重跑探测，确认授权后能否出网",
          cmd: "curl -sS -I --max-time 6 https://api.github.com",
          out: "HTTP/2 200\nserver: github.com\nx-ratelimit-limit: 60",
          auditNote: "自动审批通过"
        });
        liveOrOutcome = `
          <div class="live-activity" role="status">
            <div class="live-activity-row">
              <span class="live-activity-lead" aria-hidden="true">${ICONS.markTrace}</span>
              <span class="live-activity-text">正在汇总探测结果并生成答复</span>
            </div>
          </div>
        `;
        composerHtml = renderComposer();
      } else if (state.autoOutcome === "rejected") {
        extraTools = `
          <div class="approval-outcome approval-outcome--rejected">
            <div class="approval-outcome-head">
              <span class="approval-outcome-icon">${ICONS.shieldX}</span>
              <span class="approval-outcome-title">自动审批未通过 · 删除构建目录外的缓存文件</span>
              <span class="approval-inline-badge approval-inline-badge--danger">高风险</span>
            </div>
            <div class="approval-outcome-rail">
              <p class="approval-outcome-reason">目标路径位于当前工作区外且为不可逆删除操作，用户请求未授权清理系统级缓存。</p>
              <details class="approval-outcome-cmd">
                <summary>查看被拒命令</summary>
                <pre>$ rm -rf ~/Library/Caches/eidos-build-tmp</pre>
              </details>
            </div>
          </div>
        `;
        liveOrOutcome = `
          <div class="live-activity" role="status">
            <div class="live-activity-row">
              <span class="live-activity-lead" aria-hidden="true">${ICONS.markTrace}</span>
              <span class="live-activity-text">正在改用工作区内安全检查方案</span>
            </div>
          </div>
        `;
        composerHtml = renderComposer();
      } else if (state.autoOutcome === "escalated") {
        composerHtml = renderApprovalSheet({
          idPrefix: "demo-esc",
          title: "高危操作，需要你的确认",
          danger: true,
          chips: [{ text: "沙盒外", cls: "scope-chip--danger" }, { text: "仅本次" }],

          command: "curl -sS --noproxy '*' -I https://api.github.com",
          kvRows: [

            ["目录", "当前工作区"],
            ["执行环境", "沙盒外执行（宿主机文件与网络权限）"],
            ["授权范围", "仅本次命令"]
          ]

      feedHtml = `
        <div class="user-bubble">验证一下当前环境能否访问外网，必要时申请联网并排查失败原因</div>

          <summary>正在处理 18s</summary>

          ${extraTools}
        </details>
        ${liveOrOutcome}
      `;
      return { recoveryHtml, feedHtml, composerHtml };
    }

    // 2. Auto Review Approved (Reproducing user's screenshot!)
    if (state.scenario === "auto_approved") {
      if (!isNew) {
        feedHtml = `
          <details class="process-group" open>
            <summary>已处理 2m 27s</summary>
            <p class="process-text">我来发起一次命令级的联网审批，批准后立即用同一套探测做对照。</p>
            <div>
              <p class="old-feed-label">已批准 · RUN_SHELL</p>
              ${renderShellDetails({
                summaryText: "已完成 · 在联网审批下重跑探测，确认授权后能否出网",
                cmd: "curl -sS -I --max-time 6 https://api.github.com",
                out: "* Connected to api.github.com (20.205.243.168) port 443\n* Proxy connect aborted (127.0.0.1:10808)"

            </div>
            <p class="process-text">审批通过了 (<code>networkEnabled: true</code>)，DNS 和 TCP 都已放通，只剩 HTTPS 请求失败——我接着排查这一项。</p>
            ${renderShellDetails({
              summaryText: "已完成 · 排查审批后 HTTPS 请求为何仍失败",
              cmd: "env | grep -iE 'http_proxy|https_proxy|all_proxy'",

            <p class="process-text">找到原因了：环境里预设了本地代理 <code>127.0.0.1:10808</code>，但该代理当前没有运行。我用直连（绕过代理）验证一下。</p>
          </details>

      } else {
        feedHtml = `
          <details class="process-group" open>
            <summary>已处理 2m 27s</summary>
            <p class="process-text">我来发起一次命令级的联网审批，批准后立即用同一套探测做对照。</p>
            ${renderShellDetails({
              summaryText: "已完成 · 在联网审批下重跑探测，确认授权后能否出网",
              cmd: "curl -sS -I --max-time 6 https://api.github.com",
              out: "* Connected to api.github.com (20.205.243.168) port 443\n* Proxy connect aborted (127.0.0.1:10808)",
              auditNote: "自动审批通过"
            })}
            <p class="process-text">审批通过了 (<code>networkEnabled: true</code>)，DNS 和 TCP 都已放通，只剩 HTTPS 请求失败——我接着排查这一项。</p>
            ${renderShellDetails({
              summaryText: "已完成 · 排查审批后 HTTPS 请求为何仍失败",
              cmd: "env | grep -iE 'http_proxy|https_proxy|all_proxy'",
              out: "HTTPS_PROXY=http://127.0.0.1:10808"
            })}
            <p class="process-text">找到原因了：环境里预设了本地代理 <code>127.0.0.1:10808</code>，但该代理当前没有运行。我用直连（绕过代理）验证一下。</p>
          </details>
        `;
      }
      composerHtml = renderComposer();
      return { recoveryHtml, feedHtml, composerHtml };
    }

    // 3. Auto Review Rejected / Incomplete
    if (state.scenario === "auto_rejected") {
      if (!isNew) {
        feedHtml = `
          <div class="user-bubble">检查项目构建产物并清理旧日志</div>
          <details class="process-group" open>
            <summary>已处理 34s</summary>
            <div>
              <p class="old-feed-label">审批 · 已拒绝 · RUN_SHELL</p>
              <p class="old-feed-label">目标路径位于工作区外，用户未授权删除系统目录缓存。 Do not retry the same action or circumvent this refusal.</p>
              ${renderShellDetails({
                summaryText: "已拒绝 · 清理系统缓存目录",

  function renderScenarioControls() {
    const el = document.getElementById("scenario-controls");
    if (state.scenario === "auto_progress") {
      el.innerHTML = `
        <button type="button" class="btn btn--secondary btn--sm" data-auto-demo="approved">▶ 演示：自动通过（静默继续）</button>
        <button type="button" class="btn btn--secondary btn--sm" data-auto-demo="rejected">▶ 演示：自动拒绝（展示原因）</button>
        <button type="button" class="btn btn--secondary btn--sm" data-auto-demo="escalated">▶ 演示：升级人工（转审批卡）</button>
        <button type="button" class="btn btn--ghost btn--sm" data-auto-demo="reset">↺ 重置为进行中</button>
      `;
      return;
    }
    if (state.scenario === "manual_normal") {
      el.innerHTML = `
        <div class="demo-inline-row">
          <button type="button" class="btn btn--sm ${state.normalVariant === "shell" ? "btn--primary" : "btn--secondary"}" data-normal-variant="shell">Shell 联网命令</button>
          <button type="button" class="btn btn--sm ${state.normalVariant === "diff" ? "btn--primary" : "btn--secondary"}" data-normal-variant="diff">文件变更 Diff</button>
          <button type="button" class="btn btn--ghost btn--sm" data-normal-reset>↺ 重置</button>
        </div>
      `;
      return;
    }
    if (state.scenario === "manual_danger") {
      el.innerHTML = `
        <button type="button" class="btn btn--ghost btn--sm" data-danger-reset>↺ 重置高危审批演示</button>
      `;
      return;
    }
    if (state.scenario === "banners_edge") {
      el.innerHTML = `
        <div class="demo-inline-row">
          <button type="button" class="btn btn--sm ${!state.showExpiredCard ? "btn--primary" : "btn--secondary"}" data-edge-mode="sync">同步中状态</button>
          <button type="button" class="btn btn--sm ${state.showExpiredCard ? "btn--primary" : "btn--secondary"}" data-edge-mode="expired">已失效审批卡</button>
        </div>
      `;
      return;
    }
    el.innerHTML = "";
  }

  function renderAll() {
    const root = document.documentElement;
    root.dataset.view = state.view;
    root.dataset.theme = state.theme;
    root.dataset.platform = state.platform;
    root.dataset.width = state.width;
    root.dataset.reducedMotion = String(state.reducedMotion);

    const meta = SCENARIOS.find((s) => s.id === state.scenario) || SCENARIOS[0];
    document.getElementById("win-title").textContent = meta.title;
    document.getElementById("win-mode-pill").innerHTML = `<span class="mode-pill ${meta.mode.cls}">${esc(meta.mode.label)}</span>`;

    // Scenario List
    document.getElementById("scenario-list").innerHTML = SCENARIOS.map((s) => `
      <button type="button" class="scenario-btn" data-scenario="${s.id}" aria-pressed="${s.id === state.scenario}">
        <span>${esc(s.name)}</span>
        <span class="scenario-tag">${esc(s.tag)}</span>
      </button>
    `).join("");

    // Notes
    document.getElementById("scenario-notes").innerHTML = `
      <div class="ba-item ba-before"><b>改造前</b><span>${esc(meta.before)}</span></div>
      <div class="ba-item ba-after"><b>重构后</b><span>${esc(meta.after)}</span></div>
    `;

    renderScenarioControls();

    const { recoveryHtml, feedHtml, composerHtml } = buildScenarioView();
    document.getElementById("recovery-slot").innerHTML = recoveryHtml;
    document.getElementById("feed").innerHTML = feedHtml;
    document.getElementById("composer-slot").innerHTML = composerHtml;

    const draftEl = document.getElementById("session-composer-input");
    if (draftEl) {
      draftEl.addEventListener("input", (e) => { state.composerDraft = e.target.value; });
    }
    const normalFb = document.getElementById("normal-feedback-input");
    if (normalFb) {
      normalFb.addEventListener("input", (e) => { state.normalFeedbackText = e.target.value; });
      normalFb.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { state.normalDecision = "rejected"; renderAll(); }
      });
    }
    const dangerFb = document.getElementById("danger-feedback-input");
    if (dangerFb) {
      dangerFb.addEventListener("input", (e) => { state.dangerFeedbackText = e.target.value; });
      dangerFb.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { state.dangerDecision = "rejected"; renderAll(); }
      });
    }
  }

  function startAutoDemo(outcome) {
    clearAutoTimer();
    if (state.view !== "new") state.view = "new";
    state.autoOutcome = "running";
    state.autoStep = 1;
    state.popoverOpen = true;
    renderAll();

    if (outcome === "reset") return;

    state.autoTimer = setInterval(() => {
      if (state.autoStep < 3) {
        state.autoStep += 1;
        renderAll();
      } else {
        clearAutoTimer();
        state.popoverOpen = false;
        state.autoOutcome = outcome;
        renderAll();
      }
    }, 950);
  }

     Global Event Delegation
     ========================================================================== */
  document.addEventListener("click", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;

    const viewBtn = target.closest("[data-view-btn]");
    if (viewBtn) {
      state.view = viewBtn.dataset.viewBtn;
      document.querySelectorAll("[data-view-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b === viewBtn)));
      renderAll();
      return;
    }

    const themeBtn = target.closest("[data-theme-btn]");
    if (themeBtn) {
      state.theme = themeBtn.dataset.themeBtn;
      document.querySelectorAll("[data-theme-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b === themeBtn)));
      renderAll();
      return;
    }

    const platBtn = target.closest("[data-platform-btn]");
    if (platBtn) {
      state.platform = platBtn.dataset.platformBtn;
      document.querySelectorAll("[data-platform-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b === platBtn)));
      renderAll();
      return;
    }

    const widthBtn = target.closest("[data-width-btn]");
    if (widthBtn) {
      state.width = widthBtn.dataset.widthBtn;
      document.querySelectorAll("[data-width-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b === widthBtn)));
      renderAll();
      return;
    }

    if (target.id === "reduced-motion-btn") {
      state.reducedMotion = !state.reducedMotion;
      target.setAttribute("aria-pressed", String(state.reducedMotion));
      renderAll();
      return;
    }

    const scenarioBtn = target.closest("[data-scenario]");
    if (scenarioBtn) {
      clearAutoTimer();
      state.scenario = scenarioBtn.dataset.scenario;
      state.popoverOpen = false;
      if (state.scenario === "auto_progress") {
        state.autoOutcome = "running";
        state.autoStep = 2;
      }
      renderAll();
      return;
    }

    const autoDemoBtn = target.closest("[data-auto-demo]");
    if (autoDemoBtn) {
      startAutoDemo(autoDemoBtn.dataset.autoDemo);
      return;
    }

    if (target.closest("#auto-review-trigger")) {
      event.stopPropagation();
      state.popoverOpen = !state.popoverOpen;
      renderAll();
      return;
    }

    const normVarBtn = target.closest("[data-normal-variant]");
    if (normVarBtn) {
      state.normalVariant = normVarBtn.dataset.normalVariant;
      state.normalDecision = null;
      renderAll();
      return;
    }
    if (target.closest("[data-normal-reset]")) {
      state.normalDecision = null;
      state.normalFeedbackOpen = false;
      state.normalFeedbackText = "";
      renderAll();
      return;
    }
    if (target.closest("[data-danger-reset]")) {
      state.dangerDecision = null;
      state.dangerFeedbackOpen = false;
      state.dangerFeedbackText = "";
      renderAll();
      return;
    }

    const edgeBtn = target.closest("[data-edge-mode]");
    if (edgeBtn) {
      state.showExpiredCard = edgeBtn.dataset.edgeMode === "expired";
      renderAll();
      return;
    }

    if (target.closest("[data-recovery-retry]")) {
      state.recoveryStatus = "loading";
      renderAll();
      setTimeout(() => {
        state.recoveryStatus = "recovered";
        renderAll();
      }, 650);
      return;
    }
    if (target.closest("[data-recovery-reset]")) {
      state.recoveryStatus = "error";
      renderAll();
      return;
    }

    const sheetAction = target.closest("[data-sheet-action]");
    if (sheetAction) {
      const act = sheetAction.dataset.sheetAction;
      const sheet = sheetAction.dataset.sheet;
      if (sheet === "normal") {
        if (act === "toggle-feedback") { state.normalFeedbackOpen = !state.normalFeedbackOpen; renderAll(); document.getElementById("normal-feedback-input")?.focus(); }
        if (act === "approve") { state.normalDecision = "approved"; renderAll(); }
        if (act === "reject") { state.normalDecision = "rejected"; renderAll(); }
      } else if (sheet === "danger") {
        if (act === "toggle-feedback") { state.dangerFeedbackOpen = !state.dangerFeedbackOpen; renderAll(); document.getElementById("danger-feedback-input")?.focus(); }
        if (act === "approve") { state.dangerDecision = "approved"; renderAll(); }
        if (act === "reject") { state.dangerDecision = "rejected"; renderAll(); }
      } else if (sheet === "demo-esc") {
        if (act === "approve") { state.autoOutcome = "approved"; renderAll(); }
        if (act === "reject") { state.autoOutcome = "rejected"; renderAll(); }
      }
      return;
    }

    const copyBtn = target.closest("[data-copy-text]");
    if (copyBtn) {
      const txt = copyBtn.dataset.copyText || "";
      navigator.clipboard?.writeText(txt).catch(() => {});
      copyBtn.classList.add("is-copied");
      copyBtn.innerHTML = ICONS.check;
      setTimeout(() => {
        copyBtn.classList.remove("is-copied");
        copyBtn.innerHTML = ICONS.copy;
      }, 1500);
      return;
    }

    if (state.popoverOpen && !target.closest("#auto-review-popover")) {
      state.popoverOpen = false;
      renderAll();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.popoverOpen) {
      state.popoverOpen = false;
      renderAll();
    }
  });

  renderAll();
})();
</script>
</body>
</html>
