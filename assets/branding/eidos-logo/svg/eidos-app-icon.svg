<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS Container Background Gradient -->
    <linearGradient id="app-bg-gradient" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glass Bezel Stroke Gradient -->
    <linearGradient id="bezel-stroke" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Inner Mark Metallic Gradient -->
    <linearGradient id="mark-gradient" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Layer with Shadow -->
  <g filter="url(#icon-shadow)">
    <!-- Squircle Container -->
    <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#app-bg-gradient)"/>
    <rect x="32.5" y="32.5" width="447" height="447" rx="99.5" fill="none" stroke="url(#bezel-stroke)" stroke-width="1.5"/>
  </g>

  <!-- Embedded Centered Eidos Mark -->
  <g id="eidos-app-icon-mark" transform="translate(64, 64) scale(0.75)">
    <path fill="url(#mark-gradient)" fill-rule="evenodd" clip-rule="evenodd" d="
      M 116 80
      L 396 80
      A 36 36 0 0 1 432 116
      L 432 348
      L 348 432
      L 116 432
      A 36 36 0 0 1 80 396
      L 80 116
      A 36 36 0 0 1 116 80
      Z
      M 432 172
      L 224 172
      A 24 24 0 0 0 224 220
      L 432 220
      Z
      M 432 280
      L 224 280
      A 24 24 0 0 0 224 328
      L 432 328
      Z
    "/>
  </g>
</svg>
