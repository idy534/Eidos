<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Renderer Style Test</title>
    <style id="fixture-layout">
      #samples { padding: 16px; }
      .sample-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
      #samples > .approval-composer { --session-content-width: 49rem; }
      #selection-samples > * { width: 180px; margin: 0; }
      #content-samples { max-width: 49rem; margin: auto; padding: 16px; }
      #content-samples .workspace-text-preview { min-height: 0; }
      .fixture-menu { top: 100px; left: 16px; }
      #scrollbar-samples { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; }
      #scrollbar-samples .scrollbar-sample { display: block; flex: none; width: 180px; height: 90px; min-height: 0; max-height: none; overflow: scroll; margin: 0; padding: 0; border: 0; border-radius: 0; background: #d8ece2; }
      #scrollbar-samples .scrollbar-sample > div { width: 600px; height: 500px; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./styles.tsx"></script>
  </body>
</html>
