[package]
name = "eidos-sandbox-win"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
mxc-sdk = { git = "https://github.com/microsoft/mxc.git", rev = "c66201839d63cae2239db5e92f1f1d6076cf5181", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
