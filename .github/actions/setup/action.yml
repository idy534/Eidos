name: Install locked development dependencies
description: Set up the supported toolchain with shared caches
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "0.11.32"
        enable-cache: true
    - uses: pnpm/action-setup@v4
      with:
        version: 11.7.0
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: uv sync --frozen
      shell: bash
