name: Windows x64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'runtime/**'
      - 'protocol/**'
      - 'resources/runtime-dependencies/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'electron-builder.windows.yml'
      - 'assets/branding/**'
      - '.github/actions/setup/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check runtime/eidos_runtime runtime/tests
      - run: pnpm test:main:fast
      - run: node --test dist/main/approval-path-validation.test.js dist/main/app-logger.test.js dist/main/data-restore.test.js
      - run: node --test scripts/packaging-config.test.mjs scripts/macos-sign.test.mjs scripts/clean-renderer-assets.test.mjs
      - run: pnpm exec tsc -p tsconfig.renderer.json --noEmit
      - run: pnpm exec vitest run --config vitest.renderer.config.ts desktop/renderer/src/components/settings/BackgroundGuardrailSettings.behavior.test.tsx desktop/renderer/src/components/settings/DataSettings.behavior.test.tsx desktop/renderer/src/components/settings/McpConnectionPanel.behavior.test.tsx desktop/renderer/src/components/settings/ShellEnvironmentSettings.behavior.test.tsx desktop/renderer/src/components/settings/ManagedResourceSettings.behavior.test.tsx
      - run: uv run --locked --python 3.12 pytest -q runtime/tests/test_windows_platform.py runtime/tests/test_hooks_windows.py runtime/tests/test_windows_git_ssh.py runtime/tests/test_tool_runtime_platform_wording.py runtime/tests/test_managed_resources_cleanup.py runtime/tests/test_guardrails.py runtime/tests/test_context_capacity_recovery.py
      - run: pnpm package:win
      - run: pnpm test:electron-smoke
      - run: pnpm test:electron-packaged
      - name: Exercise bundled document Skills in PowerShell
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path build/windows-runtime/app).Path
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONUTF8 = '1'
          $env:OTEL_SDK_DISABLED = 'true'
          & ./build/windows-runtime/python/python.exe -B ./scripts/bundled-document-skills-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: eidos-windows-x64
          path: release/Eidos-*-win-x64.exe
          if-no-files-found: error
