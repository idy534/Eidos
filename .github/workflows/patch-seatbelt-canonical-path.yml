name: Patch Seatbelt canonical path

on:
  push:
    branches:
      - agent/fix-seatbelt-canonical-path

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-seatbelt-canonical-path
      - name: Canonicalize secure move paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('runtime/eidos_runtime/sandbox/seatbelt.py')
          text = path.read_text()
          old = '''    workspace = workspace_root.absolute()\n    try:\n        source.absolute().relative_to(workspace)\n        target.absolute().relative_to(workspace)\n    except ValueError:\n        return "failed"\n'''
          new = '''    workspace = workspace_root.resolve()\n    source_path = source.resolve()\n    target_path = target.resolve(strict=False)\n    try:\n        source_path.relative_to(workspace)\n        target_path.relative_to(workspace)\n    except ValueError:\n        return "failed"\n'''
          if old not in text:
              raise SystemExit('secure_workspace_move path block not found')
          text = text.replace(old, new, 1)
          text = text.replace('        str(source),\n        str(target),\n', '        str(source_path),\n        str(target_path),\n', 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/eidos_runtime/sandbox/seatbelt.py
          git commit -m "fix(runtime): canonicalize secure commit paths"
          git push origin HEAD:agent/fix-seatbelt-canonical-path
