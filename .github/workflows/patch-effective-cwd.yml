name: Patch effective cwd regression

on:
  push:
    branches:
      - agent/fix-runtime-effective-cwd-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-effective-cwd-ci
      - name: Patch missing effective cwd
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('runtime/eidos_runtime/db/repositories/execution.py')
          text = path.read_text()
          old = '''                    workspace_version=int(run["workspace_version"]),\n                    created_at=_now_ms(),\n'''
          new = '''                    workspace_version=int(run["workspace_version"]),\n                    effective_cwd=rule_resolution_snapshot.cwd,\n                    created_at=_now_ms(),\n'''
          if old not in text:
              raise SystemExit('expected create_step_resolution_snapshot call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/eidos_runtime/db/repositories/execution.py
          git commit -m "fix(runtime): persist default step effective cwd"
          git push origin HEAD:agent/fix-runtime-effective-cwd-ci
