name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        # v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm check:contracts:model-profile
      - run: pnpm lint:python
      - run: pnpm deps:python
      - run: pnpm audit:python
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:seatbelt-native
      - run: pnpm test:electron-smoke
      - run: git diff --check
