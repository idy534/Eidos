name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      desktop: ${{ steps.scope.outputs.desktop }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint:python
      - if: ${{ !cancelled() }}
        run: pnpm deps:python
      - if: ${{ !cancelled() }}
        run: git diff --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bash scripts/audit-python.sh
      - if: ${{ !cancelled() }}
        run: pnpm audit:runtime-node

  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:runtime:full

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - if: ${{ !cancelled() }}
        run: pnpm test:contracts
      - if: ${{ !cancelled() }}
        run: pnpm test:renderer-state
      - if: ${{ !cancelled() }}
        run: pnpm test:renderer-behavior
      - if: ${{ !cancelled() }}
        run: pnpm test:main
      - if: ${{ !cancelled() }}
        run: pnpm test:packaging

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: build
        run: pnpm build
      - id: seatbelt
        if: ${{ !cancelled() }}
        run: pnpm test:seatbelt-native
      - id: electron
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:electron-smoke
      - id: bundle
        if: ${{ !cancelled() }}
        run: pnpm build:runtime:mac
      - id: bundled
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: pnpm test:runtime:bundled
      - id: bundled_seatbelt
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: pnpm test:runtime:bundled-seatbelt
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.seatbelt.outcome == 'success' && steps.electron.outcome == 'success' && steps.bundled.outcome == 'success' && steps.bundled_seatbelt.outcome == 'success' }}
        name: Build and smoke-test the local packaged macOS DMG
        run: EIDOS_PACKAGE_SKIP_TESTS=1 pnpm package:mac

  test:
    needs: [changes, quality, security, runtime, desktop, native]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          checks = json.loads(os.environ['RESULTS'])
          failed = [name for name, check in checks.items() if check['result'] not in {'success', 'skipped'}]
          if checks['changes']['result'] != 'success':
              raise SystemExit('Change detection did not succeed')
          for name in ('runtime', 'desktop', 'native'):
              if checks['changes']['outputs'].get(name) == 'true' and checks[name]['result'] != 'success':
                  failed.append(name)
          if failed:
              raise SystemExit('Failed checks: ' + ', '.join(sorted(set(failed))))
          PYTHON
