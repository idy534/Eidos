name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        # v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
#      - run: pnpm check:contracts:model-profile
      - run: pnpm lint:python
      - run: pnpm deps:python
      - run: pnpm audit:python
      - run: pnpm test:packaging
      - run: pnpm test:full
      - run: pnpm build
      - run: pnpm test:seatbelt-native
      - run: pnpm test:electron-smoke
      - run: pnpm build:runtime:mac
      - run: pnpm test:runtime:bundled
      - run: pnpm test:runtime:bundled-seatbelt
      - name: Build and smoke-test the local packaged macOS DMG
        run: EIDOS_PACKAGE_SKIP_TESTS=1 pnpm package:mac
      - run: git diff --check
