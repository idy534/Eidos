name: Align P0 legacy tests

on:
  push:
    branches:
      - agent/align-p0-legacy-tests

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-p0-legacy-tests
      - name: Align legacy assertions with P0 prompt contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_s, old, new):
              path = Path(path_s)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found: {path_s}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          p = 'runtime/tests/test_instruction_resolution.py'
          replace(p, 'self.assertFalse(any("Keep changes focused." in value for value in ordinary_content))', 'self.assertTrue(any("Keep changes focused." in value for value in ordinary_content))')
          replace(p, 'self.assertFalse(any("Use the review checklist." in value for value in ordinary_content))', 'self.assertTrue(any("Use the review checklist." in value for value in ordinary_content))')
          replace(p, 'self.assertIn("Keep changes focused.", built.instructions.text)', 'self.assertNotIn("Keep changes focused.", built.instructions.system_text)')
          replace(p, 'self.assertIn("Use the review checklist.", built.instructions.text)', 'self.assertNotIn("Use the review checklist.", built.instructions.system_text)')
          replace(p, 'self.assertEqual(baseline.model_context, expanded.model_context)', 'self.assertNotEqual(baseline.model_context, expanded.model_context)')

          p = 'runtime/tests/test_phase3_runtime.py'
          replace(p, 'self.assertNotIn("Use the checklist", json.dumps(model.contexts[0]))', 'self.assertIn("Use the checklist", json.dumps(model.contexts[0]))')
          replace(p, 'self.assertIn("Use the checklist", model.instructions_history[0])', 'self.assertNotIn("Use the checklist", model.instructions_history[0])')

          p = 'runtime/tests/test_phase4a_tool_context.py'
          replace(p, 'self.assertEqual(catalog_indexes, [1])', 'self.assertEqual(catalog_indexes, [2])')
          replace(p, 'self.assertNotIn("Use the checklist.", rendered)', 'self.assertIn("Use the checklist.", rendered)')
          replace(p, 'self.assertIn("Use the checklist.", built.instructions.text)', 'self.assertNotIn("Use the checklist.", built.instructions.system_text)')
          replace(p, 'self.assertEqual(catalogs, [1])', 'self.assertEqual(catalogs, [2])')
          replace(p, 'self.assertNotIn("Use the checklist.", json.dumps(context))', 'self.assertIn("Use the checklist.", json.dumps(context))')
          replace(p, 'self.assertIn("Use the checklist.", instructions)', 'self.assertNotIn("Use the checklist.", instructions)')
          replace(p, 'self.assertNotIn("Use the checklist.", json.dumps(first_model.contexts[0]))', 'self.assertIn("Use the checklist.", json.dumps(first_model.contexts[0]))')
          replace(p, 'self.assertIn("Use the checklist.", first_model.instructions_history[0])', 'self.assertNotIn("Use the checklist.", first_model.instructions_history[0])')

          p = 'runtime/tests/test_r4a_resolution.py'
          replace(p, 'self.assertIn("Use another model", model.instructions_history[0])', 'self.assertNotIn("Use another model", model.instructions_history[0])')
          replace(p, 'self.assertNotIn("Use another model", step.context_payload_json)', 'self.assertIn("Use another model", step.context_payload_json)')
          replace(p, 'self.assertNotIn("old rule", json.dumps(first_context))', 'self.assertIn("old rule", json.dumps(first_context))')
          replace(p, 'self.assertNotIn("new rule", json.dumps(second_context))', 'self.assertIn("new rule", json.dumps(second_context))')
          replace(p, 'self.assertIn("old rule", first_request["systemPrompt"])', 'self.assertNotIn("old rule", first_request["systemPrompt"])')
          replace(p, 'self.assertIn("new rule", second_request["systemPrompt"])', 'self.assertNotIn("new rule", second_request["systemPrompt"])')
          replace(p, 'self.assertNotEqual(\n            snapshots[0].system_prompt_hash,\n            snapshots[1].system_prompt_hash,\n        )', 'self.assertEqual(\n            snapshots[0].system_prompt_hash,\n            snapshots[1].system_prompt_hash,\n        )')
          replace(p, 'self.assertIn(\n            "persistent rule",\n            json.loads(after.final_request_json)["systemPrompt"],\n        )', 'self.assertIn("persistent rule", after.context_payload_json)\n        self.assertNotIn(\n            "persistent rule",\n            json.loads(after.final_request_json)["systemPrompt"],\n        )')

          p = 'runtime/tests/test_runtime_hardening.py'
          replace(p, 'self.assertNotIn("Use review checklist.", json.dumps(model.contexts[1]))', 'self.assertIn("Use review checklist.", json.dumps(model.contexts[1]))')
          replace(p, 'self.assertIn("Use review checklist.", model.instructions_history[1])', 'self.assertNotIn("Use review checklist.", model.instructions_history[1])')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/tests
          git commit -m "test(runtime): align legacy prompt assertions"
          git push origin HEAD:agent/align-p0-legacy-tests
