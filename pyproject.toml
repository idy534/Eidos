[project]
name = "eidos-python-runtime"
version = "0.3.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anyio>=4.14,<5",
    "httpx>=0.28,<0.29",
    "jsonschema==4.26.0",
    "openai>=2.51,<3",
    "pydantic==2.12.5",
    "pydantic-ai-slim[openai,retries]==2.13.0",
    "tenacity>=9,<10",
    "mcp>=1.27,<2",
    "referencing==0.37.0",
    "pathspec>=1.1,<2",
    "unidiff==1.0.0",
    "charset-normalizer>=3.4,<4",
    "rapidfuzz>=3,<4",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "watchfiles>=1.1,<2",
]

[dependency-groups]
dev = [
    "deptry>=0.23,<0.24",
    "pip-audit>=2.8,<3",
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["runtime/tests"]
pythonpath = ["runtime"]
addopts = ["-ra", "-m", "not large_repository"]
markers = [
    "large_repository: separately scheduled repository scale validation",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally re-export legacy Runtime storage/protocol symbols.
"runtime/eidos_runtime/db/storage.py" = ["F401"]
"runtime/eidos_runtime/protocol/server.py" = ["F401"]

[tool.deptry]
known_first_party = ["eidos_runtime", "github_utils"]
